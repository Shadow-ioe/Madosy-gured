name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip -q MadosyGuard-source.zip
      - run: cd MadosyGuard && mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: MadosyGuard
          path: MadosyGuard/target/MadosyGuard.jar
